# Cyberpunk - High-tech low-life aesthetic
window-width = 140
window-height = 40

# Font configuration
font-family = "Courier Prime"
font-size = 14
adjust-cell-height = 32%
line-height = 1.18

# Theme colors - Cyberpunk
background = 000b1e
foreground = 0abdc6
cursor-color = ff2a6d
selection-background = 0a4da3
selection-foreground = 0abdc6

# Palette
palette = 0=#123e7c
palette = 1=#ff0000
palette = 2=#d300c4
palette = 3=#f57800
palette = 4=#123e7c
palette = 5=#711c91
palette = 6=#0abdc6
palette = 7=#d7d7d5
palette = 8=#1c61c2
palette = 9=#ff0000
palette = 10=#d300c4
palette = 11=#ff9800
palette = 12=#00ff00
palette = 13=#711c91
palette = 14=#0abdc6
palette = 15=#ffffff

# Performance and behavior
window-theme = dark
background-opacity = 0.85
unfocused-split-opacity = 0.65
renderer = metal
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Custom shader
custom-shader = ~/.config/ghostty/shaders/matrix-rain.glsl
custom-shader-animation = true

# Text rendering
text-wrap = false

# Keybinds
keybind = cmd+shift+r=reload_config
