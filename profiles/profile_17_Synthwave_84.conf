# Synthwave 84 - Retro futuristic neon theme
window-width = 140
window-height = 40

# Font configuration
font-family = "BerkeleyMono Nerd Font"
font-size = 14
adjust-cell-height = 35%

# Theme colors - Synthwave 84
background = 262335
foreground = f0eff1
cursor-color = f0eff1
selection-background = 463465
selection-foreground = f0eff1

# Palette
palette = 0=#262335
palette = 1=#fe4450
palette = 2=#72f1b8
palette = 3=#fede5d
palette = 4=#03edf9
palette = 5=#ff7edb
palette = 6=#6d77ff
palette = 7=#f0eff1
palette = 8=#463465
palette = 9=#fe4450
palette = 10=#72f1b8
palette = 11=#fede5d
palette = 12=#03edf9
palette = 13=#ff7edb
palette = 14=#6d77ff
palette = 15=#ffffff

# Performance and behavior
window-theme = dark
background-opacity = 0.88
unfocused-split-opacity = 0.7
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Custom shader
custom-shader = ~/.config/ghostty/shaders/retro-terminal.glsl
custom-shader-animation = true

# Text rendering

# Keybinds
keybind = super+shift+r=reload_config
