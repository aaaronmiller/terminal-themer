# Ayu Dark - Simple, bright and elegant theme
window-width = 140
window-height = 40

# Font configuration
font-family = "Iosevka"
font-size = 14
adjust-cell-height = 28%

# Theme colors - Ayu Dark
background = 0a0e14
foreground = b3b1ad
cursor-color = e6b450
selection-background = 253340
selection-foreground = b3b1ad

# Palette
palette = 0=#01060e
palette = 1=#ea6c73
palette = 2=#91b362
palette = 3=#f9af4f
palette = 4=#53bdfa
palette = 5=#fae994
palette = 6=#90e1c6
palette = 7=#c7c7c7
palette = 8=#686868
palette = 9=#f07178
palette = 10=#c2d94c
palette = 11=#ffb454
palette = 12=#59c2ff
palette = 13=#ffee99
palette = 14=#95e6cb
palette = 15=#ffffff

# Performance and behavior
window-theme = dark
background-opacity = 0.90
unfocused-split-opacity = 0.7
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Custom shader
custom-shader = ~/.config/ghostty/shaders/starfield.glsl
custom-shader-animation = true

# Text rendering

# Keybinds
keybind = super+shift+r=reload_config
