# GitHub Dark - Official GitHub dark theme
window-width = 140
window-height = 40

# Font configuration
font-family = "JetBrainsMono Nerd Font"
font-size = 13
adjust-cell-height = 30%

# Theme colors - GitHub Dark
background = 0d1117
foreground = c9d1d9
cursor-color = c9d1d9
selection-background = 264f78
selection-foreground = c9d1d9

# Palette
palette = 0=#484f58
palette = 1=#ff7b72
palette = 2=#3fb950
palette = 3=#d29922
palette = 4=#58a6ff
palette = 5=#bc8cff
palette = 6=#39c5cf
palette = 7=#b1bac4
palette = 8=#6e7681
palette = 9=#ffa198
palette = 10=#56d364
palette = 11=#e3b341
palette = 12=#79c0ff
palette = 13=#d2a8ff
palette = 14=#56d4dd
palette = 15=#f0f6fc

# Performance and behavior
window-theme = dark
background-opacity = 1.0
unfocused-split-opacity = 0.75
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Text rendering

# Keybinds
keybind = super+shift+r=reload_config
