# Oceanic Next - Deep ocean inspired theme
window-width = 140
window-height = 40

# Font configuration
font-family = "Anonymous Pro"
font-size = 14
adjust-cell-height = 30%
line-height = 1.2

# Theme colors - Oceanic Next
background = 1b2b34
foreground = d8dee9
cursor-color = d8dee9
selection-background = 343d46
selection-foreground = d8dee9

# Palette
palette = 0=#1b2b34
palette = 1=#ec5f67
palette = 2=#99c794
palette = 3=#fac863
palette = 4=#6699cc
palette = 5=#c594c5
palette = 6=#5fb3b3
palette = 7=#d8dee9
palette = 8=#65737e
palette = 9=#ec5f67
palette = 10=#99c794
palette = 11=#fac863
palette = 12=#6699cc
palette = 13=#c594c5
palette = 14=#5fb3b3
palette = 15=#ffffff

# Performance and behavior
window-theme = dark
background-opacity = 0.93
unfocused-split-opacity = 0.7
renderer = metal
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Custom shader
custom-shader = ~/.config/ghostty/shaders/underwater.glsl
custom-shader-animation = true

# Text rendering
text-wrap = false

# Keybinds
keybind = cmd+shift+r=reload_config
