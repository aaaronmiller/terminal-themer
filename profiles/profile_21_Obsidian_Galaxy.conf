# My Setup - Personal config (Catppuccin Mocha + Galaxy shader, Fedora/GNOME)
# ---
# title: ghostty-config
# platform: Linux (Fedora 43 + GNOME, Surface Laptop Gen 4)
# ver: 4.0
# ---

# =========================================================
#  FONT
# =========================================================
font-family = JetBrainsMono Nerd Font
font-size = 12
adjust-cell-height = 35%
font-feature = +liga

# =========================================================
#  THEME / COLORS / CURSOR
# =========================================================
theme = Catppuccin Mocha
background = 1C2021
cursor-style = block

# =========================================================
#  DISPLAY / GEOMETRY
# =========================================================
window-width = 140
window-height = 30
fullscreen = false
window-padding-x = 4
window-padding-y = 4
window-padding-balance = true
window-save-state = always
window-decoration = true

# =========================================================
#  UX / QUALITY
# =========================================================
mouse-hide-while-typing = true
mouse-scroll-multiplier = 2
copy-on-select = clipboard
shell-integration-features = no-cursor,sudo,no-title

# =========================================================
#  SCROLLBACK / PERFORMANCE
# =========================================================
scrollback-limit = 25000000

# =========================================================
#  SHADER - Galaxy (sci-fi, readable)
# =========================================================
custom-shader = ~/.config/ghostty/shaders/galaxy.glsl
custom-shader-animation = true

# =========================================================
#  KEYBINDINGS
#  Note: 'super' = Win key on Linux
# =========================================================
keybind = super+shift+r=reload_config
keybind = super+shift+x=close_surface
keybind = super+shift+n=new_window

# Tabs
keybind = super+shift+c=new_tab
keybind = super+shift+l=next_tab
keybind = super+shift+h=previous_tab
keybind = super+shift+comma=move_tab:-1
keybind = super+shift+period=move_tab:1

# Quick tab switch
keybind = super+1=goto_tab:1
keybind = super+2=goto_tab:2
keybind = super+3=goto_tab:3
keybind = super+4=goto_tab:4
keybind = super+5=goto_tab:5
keybind = super+6=goto_tab:6
keybind = super+7=goto_tab:7
keybind = super+8=goto_tab:8
keybind = super+9=goto_tab:9

# Splits
keybind = super+shift+backslash=new_split:right
keybind = super+shift+minus=new_split:down
keybind = super+shift+j=goto_split:bottom
keybind = super+shift+k=goto_split:top
keybind = super+shift+h=goto_split:left
keybind = super+shift+l=goto_split:right
keybind = super+shift+z=toggle_split_zoom
keybind = super+shift+e=equalize_splits

# Special
keybind = shift+enter=text:\x1b\r
