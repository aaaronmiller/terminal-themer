# prompt: github-dark
# Apply with: ss --prompt github-dark (merges palette into starship.toml)

[palettes.github-dark]
accent    = "#58a6ff"
secondary = "#39d353"
warning   = "#e3b341"
success   = "#3fb950"
error     = "#f85149"
muted     = "#30363d"
surface   = "#0d1117"
# Segment color aliases (maps to starship segment styles)
red       = "#f85149"
peach     = "#e3b341"
yellow    = "#e3b341"
green     = "#3fb950"
sapphire  = "#39d353"
lavender  = "#58a6ff"
crust     = "#0d1117"
