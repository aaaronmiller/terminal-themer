# Dracula - Dark theme with vibrant colors
window-width = 140
window-height = 40

# Font configuration
font-family = "JetBrainsMono Nerd Font"
font-size = 14
adjust-cell-height = 32%

# Theme colors - Dracula
background = 282a36
foreground = f8f8f2
cursor-color = f8f8f2
selection-background = 44475a
selection-foreground = f8f8f2

# Palette
palette = 0=#21222c
palette = 1=#ff5555
palette = 2=#50fa7b
palette = 3=#f1fa8c
palette = 4=#bd93f9
palette = 5=#ff79c6
palette = 6=#8be9fd
palette = 7=#f8f8f2
palette = 8=#6272a4
palette = 9=#ff6e6e
palette = 10=#69ff94
palette = 11=#ffffa5
palette = 12=#d6acff
palette = 13=#ff92df
palette = 14=#a4ffff
palette = 15=#ffffff

# Performance and behavior
window-theme = dark
background-opacity = 0.92
unfocused-split-opacity = 0.7
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Custom shader
custom-shader = ~/.config/ghostty/shaders/galaxy.glsl
custom-shader-animation = true

# Text rendering

# Keybinds
keybind = super+shift+r=reload_config
