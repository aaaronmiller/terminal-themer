# Catppuccin Mocha - Cozy dark theme
window-width = 140
window-height = 40

# Font configuration
font-family = "JetBrains Mono"
font-size = 13
adjust-cell-height = 30%

# Theme colors - Catppuccin Mocha
background = 1e1e2e
foreground = cdd6f4
cursor-color = f5e0dc
selection-background = 585b70
selection-foreground = cdd6f4

# Palette
palette = 0=#45475a
palette = 1=#f38ba8
palette = 2=#a6e3a1
palette = 3=#f9e2af
palette = 4=#89b4fa
palette = 5=#f5c2e7
palette = 6=#94e2d5
palette = 7=#bac2de
palette = 8=#585b70
palette = 9=#f38ba8
palette = 10=#a6e3a1
palette = 11=#f9e2af
palette = 12=#89b4fa
palette = 13=#f5c2e7
palette = 14=#94e2d5
palette = 15=#a6adc8

# Performance and behavior
window-theme = dark
background-opacity = 0.95
unfocused-split-opacity = 0.7
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Custom shader
custom-shader = ~/.config/ghostty/shaders/animated-gradient-shader.glsl
custom-shader-animation = true

# Text rendering

# Keybinds
keybind = super+shift+r=reload_config
