# Nord - Arctic, north-bluish theme
window-width = 140
window-height = 40

# Font configuration
font-family = "Fira Code"
font-size = 13
adjust-cell-height = 28%
line-height = 1.18

# Theme colors - Nord
background = 2e3440
foreground = d8dee9
cursor-color = d8dee9
selection-background = 4c566a
selection-foreground = d8dee9

# Palette
palette = 0=#3b4252
palette = 1=#bf616a
palette = 2=#a3be8c
palette = 3=#ebcb8b
palette = 4=#81a1c1
palette = 5=#b48ead
palette = 6=#88c0d0
palette = 7=#e5e9f0
palette = 8=#4c566a
palette = 9=#bf616a
palette = 10=#a3be8c
palette = 11=#ebcb8b
palette = 12=#81a1c1
palette = 13=#b48ead
palette = 14=#8fbcbb
palette = 15=#eceff4

# Performance and behavior
window-theme = dark
background-opacity = 1.0
unfocused-split-opacity = 0.75
renderer = metal
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Text rendering
text-wrap = false

# Keybinds
keybind = cmd+shift+r=reload_config
