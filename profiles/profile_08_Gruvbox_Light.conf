# Gruvbox Light - Retro groove warm light theme
window-width = 140
window-height = 40

# Font configuration
font-family = "Cascadia Code"
font-size = 13
adjust-cell-height = 30%

# Theme colors - Gruvbox Light
background = fbf1c7
foreground = 3c3836
cursor-color = 3c3836
selection-background = ebdbb2
selection-foreground = 3c3836

# Palette
palette = 0=#fbf1c7
palette = 1=#cc241d
palette = 2=#98971a
palette = 3=#d79921
palette = 4=#458588
palette = 5=#b16286
palette = 6=#689d6a
palette = 7=#7c6f64
palette = 8=#928374
palette = 9=#9d0006
palette = 10=#79740e
palette = 11=#b57614
palette = 12=#076678
palette = 13=#8f3f71
palette = 14=#427b58
palette = 15=#3c3836

# Performance and behavior
window-theme = light
background-opacity = 1.0
unfocused-split-opacity = 0.8
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Text rendering

# Keybinds
keybind = super+shift+r=reload_config
