# Palenight - Material darker theme variant
window-width = 140
window-height = 40

# Font configuration
font-family = "Consolas"
font-size = 13
adjust-cell-height = 32%

# Theme colors - Palenight
background = 292d3e
foreground = a6accd
cursor-color = ffcc00
selection-background = 676e95
selection-foreground = a6accd

# Palette
palette = 0=#292d3e
palette = 1=#f07178
palette = 2=#c3e88d
palette = 3=#ffcb6b
palette = 4=#82aaff
palette = 5=#c792ea
palette = 6=#89ddff
palette = 7=#959dcb
palette = 8=#676e95
palette = 9=#f07178
palette = 10=#c3e88d
palette = 11=#ffcb6b
palette = 12=#82aaff
palette = 13=#c792ea
palette = 14=#89ddff
palette = 15=#ffffff

# Performance and behavior
window-theme = dark
background-opacity = 0.95
unfocused-split-opacity = 0.75
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Text rendering

# Keybinds
keybind = super+shift+r=reload_config
