# Everforest Dark - Comfortable & pleasant green forest theme
window-width = 140
window-height = 40

# Font configuration
font-family = "Ubuntu Mono"
font-size = 14
adjust-cell-height = 32%
line-height = 1.18

# Theme colors - Everforest Dark
background = 2d353b
foreground = d3c6aa
cursor-color = d3c6aa
selection-background = 475258
selection-foreground = d3c6aa

# Palette
palette = 0=#475258
palette = 1=#e67e80
palette = 2=#a7c080
palette = 3=#dbbc7f
palette = 4=#7fbbb3
palette = 5=#d699b6
palette = 6=#83c092
palette = 7=#d3c6aa
palette = 8=#475258
palette = 9=#e67e80
palette = 10=#a7c080
palette = 11=#dbbc7f
palette = 12=#7fbbb3
palette = 13=#d699b6
palette = 14=#83c092
palette = 15=#d3c6aa

# Performance and behavior
window-theme = dark
background-opacity = 0.96
unfocused-split-opacity = 0.75
renderer = metal
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Custom shader
custom-shader = ~/.config/ghostty/shaders/forest-fog.glsl
custom-shader-animation = true

# Text rendering
text-wrap = false

# Keybinds
keybind = cmd+shift+r=reload_config
