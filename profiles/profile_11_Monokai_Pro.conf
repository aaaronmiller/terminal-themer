# Monokai Pro - Professional dark theme
window-width = 140
window-height = 40

# Font configuration
font-family = "Monaco"
font-size = 13
adjust-cell-height = 30%

# Theme colors - Monokai Pro
background = 2d2a2e
foreground = fcfcfa
cursor-color = fcfcfa
selection-background = 5b595c
selection-foreground = fcfcfa

# Palette
palette = 0=#2d2a2e
palette = 1=#ff6188
palette = 2=#a9dc76
palette = 3=#ffd866
palette = 4=#fc9867
palette = 5=#ab9df2
palette = 6=#78dce8
palette = 7=#fcfcfa
palette = 8=#727072
palette = 9=#ff6188
palette = 10=#a9dc76
palette = 11=#ffd866
palette = 12=#fc9867
palette = 13=#ab9df2
palette = 14=#78dce8
palette = 15=#ffffff

# Performance and behavior
window-theme = dark
background-opacity = 0.94
unfocused-split-opacity = 0.7
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Custom shader
custom-shader = ~/.config/ghostty/shaders/glitchy.glsl
custom-shader-animation = false

# Text rendering

# Keybinds
keybind = super+shift+r=reload_config
