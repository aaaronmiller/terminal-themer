# One Dark - Iconic Atom One Dark theme
window-width = 140
window-height = 40

# Font configuration
font-family = "Hack Nerd Font"
font-size = 13
adjust-cell-height = 30%

# Theme colors - One Dark
background = 282c34
foreground = abb2bf
cursor-color = abb2bf
selection-background = 3e4451
selection-foreground = abb2bf

# Palette
palette = 0=#282c34
palette = 1=#e06c75
palette = 2=#98c379
palette = 3=#e5c07b
palette = 4=#61afef
palette = 5=#c678dd
palette = 6=#56b6c2
palette = 7=#abb2bf
palette = 8=#5c6370
palette = 9=#e06c75
palette = 10=#98c379
palette = 11=#e5c07b
palette = 12=#61afef
palette = 13=#c678dd
palette = 14=#56b6c2
palette = 15=#ffffff

# Performance and behavior
window-theme = dark
background-opacity = 0.96
unfocused-split-opacity = 0.75
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Text rendering

# Keybinds
keybind = super+shift+r=reload_config
