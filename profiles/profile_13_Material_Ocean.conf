# Material Ocean - Material Design inspired ocean theme
window-width = 140
window-height = 40

# Font configuration
font-family = "Roboto Mono"
font-size = 13
adjust-cell-height = 30%

# Theme colors - Material Ocean
background = 0f111a
foreground = 8f93a2
cursor-color = ffcc00
selection-background = 1f2233
selection-foreground = 8f93a2

# Palette
palette = 0=#0f111a
palette = 1=#ff5370
palette = 2=#c3e88d
palette = 3=#ffcb6b
palette = 4=#82aaff
palette = 5=#c792ea
palette = 6=#89ddff
palette = 7=#b0bec5
palette = 8=#546e7a
palette = 9=#f07178
palette = 10=#c3e88d
palette = 11=#ffcb6b
palette = 12=#82aaff
palette = 13=#c792ea
palette = 14=#89ddff
palette = 15=#ffffff

# Performance and behavior
window-theme = dark
background-opacity = 0.92
unfocused-split-opacity = 0.7
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Custom shader
custom-shader = ~/.config/ghostty/shaders/water.glsl
custom-shader-animation = true

# Text rendering

# Keybinds
keybind = super+shift+r=reload_config
