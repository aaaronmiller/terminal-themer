# Catppuccin Latte - Light theme for bright environments
window-width = 140
window-height = 40

# Font configuration
font-family = "BerkeleyMono Nerd Font"
font-size = 14
adjust-cell-height = 35%
line-height = 1.15

# Theme colors - Catppuccin Latte
background = eff1f5
foreground = 4c4f69
cursor-color = dc8a78
selection-background = acb0be
selection-foreground = eff1f5

# Palette
palette = 0=#5c5f77
palette = 1=#d20f39
palette = 2=#40a02b
palette = 3=#df8e1d
palette = 4=#1e66f5
palette = 5=#ea76cb
palette = 6=#179299
palette = 7=#acb0be
palette = 8=#6c6f85
palette = 9=#d20f39
palette = 10=#40a02b
palette = 11=#df8e1d
palette = 12=#1e66f5
palette = 13=#ea76cb
palette = 14=#179299
palette = 15=#bcc0cc

# Performance and behavior
window-theme = light
background-opacity = 1.0
unfocused-split-opacity = 0.8
renderer = metal
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Text rendering
text-wrap = false

# Keybinds
keybind = cmd+shift+r=reload_config
