# Solarized Dark - Precision colors for machines and people
window-width = 140
window-height = 40

# Font configuration
font-family = "Menlo"
font-size = 13
adjust-cell-height = 30%
line-height = 1.2

# Theme colors - Solarized Dark
background = 002b36
foreground = 839496
cursor-color = 839496
selection-background = 073642
selection-foreground = 839496

# Palette
palette = 0=#073642
palette = 1=#dc322f
palette = 2=#859900
palette = 3=#b58900
palette = 4=#268bd2
palette = 5=#d33682
palette = 6=#2aa198
palette = 7=#eee8d5
palette = 8=#002b36
palette = 9=#cb4b16
palette = 10=#586e75
palette = 11=#657b83
palette = 12=#839496
palette = 13=#6c71c4
palette = 14=#93a1a1
palette = 15=#fdf6e3

# Performance and behavior
window-theme = dark
background-opacity = 1.0
unfocused-split-opacity = 0.75
renderer = metal
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Text rendering
text-wrap = false

# Keybinds
keybind = cmd+shift+r=reload_config
