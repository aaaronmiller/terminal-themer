# Tokyo Night - A dark theme inspired by Tokyo at night
window-width = 140
window-height = 40

# Font configuration
font-family = "Victor Mono"
font-size = 13
adjust-cell-height = 32%

# Theme colors - Tokyo Night
background = 1a1b26
foreground = c0caf5
cursor-color = c0caf5
selection-background = 283457
selection-foreground = c0caf5

# Palette
palette = 0=#15161e
palette = 1=#f7768e
palette = 2=#9ece6a
palette = 3=#e0af68
palette = 4=#7aa2f7
palette = 5=#bb9af7
palette = 6=#7dcfff
palette = 7=#a9b1d6
palette = 8=#414868
palette = 9=#f7768e
palette = 10=#9ece6a
palette = 11=#e0af68
palette = 12=#7aa2f7
palette = 13=#bb9af7
palette = 14=#7dcfff
palette = 15=#c0caf5

# Performance and behavior
window-theme = dark
background-opacity = 0.93
unfocused-split-opacity = 0.7
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Custom shader
custom-shader = ~/.config/ghostty/shaders/bloom.glsl
custom-shader-animation = true

# Text rendering

# Keybinds
keybind = super+shift+r=reload_config
