# prompt: solarized-dark
# Apply with: ss --prompt solarized-dark (merges palette into starship.toml)

[palettes.solarized-dark]
accent    = "#268bd2"
secondary = "#2aa198"
warning   = "#b58900"
success   = "#859900"
error     = "#dc322f"
muted     = "#586e75"
surface   = "#002b36"
# Segment color aliases (maps to starship segment styles)
red       = "#dc322f"
peach     = "#b58900"
yellow    = "#b58900"
green     = "#859900"
sapphire  = "#2aa198"
lavender  = "#268bd2"
crust     = "#002b36"
