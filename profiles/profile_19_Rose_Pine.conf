# Rose Pine - All natural pine, faux fur and a bit of soho vibes
window-width = 140
window-height = 40

# Font configuration
font-family = "IBM Plex Mono"
font-size = 13
adjust-cell-height = 30%

# Theme colors - Rose Pine
background = 191724
foreground = e0def4
cursor-color = e0def4
selection-background = 2a273f
selection-foreground = e0def4

# Palette
palette = 0=#26233a
palette = 1=#eb6f92
palette = 2=#9ccfd8
palette = 3=#f6c177
palette = 4=#31748f
palette = 5=#c4a7e7
palette = 6=#ebbcba
palette = 7=#e0def4
palette = 8=#6e6a86
palette = 9=#eb6f92
palette = 10=#9ccfd8
palette = 11=#f6c177
palette = 12=#31748f
palette = 13=#c4a7e7
palette = 14=#ebbcba
palette = 15=#e0def4

# Performance and behavior
window-theme = dark
background-opacity = 0.94
unfocused-split-opacity = 0.7
scrollback-limit = 25000
mouse-scroll-multiplier = 3

# Custom shader
custom-shader = ~/.config/ghostty/shaders/animated-gradient-shader.glsl
custom-shader-animation = true

# Text rendering

# Keybinds
keybind = super+shift+r=reload_config
